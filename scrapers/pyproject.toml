[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyshells-scraper-plugins"
version = "1.0.0"
description = "Core shared data models, pipelines and utilities for Cyshells scraper agents"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.0",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.0.0",
    "motor>=3.3.0",
    "boto3>=1.43.0",

    "opencv-python>=4.8.0,<5.0.0",
    "ultralytics>=8.0.0,<9.0.0",
    "requests>=2.31.0,<3.0.0",
    "torch>=2.0.0,<3.0.0",
    "numpy>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "pipelines*", "utils*"]