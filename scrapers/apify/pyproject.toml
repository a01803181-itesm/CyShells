[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Cyshells-apify-based-scraper"
version = "1.0.0"
description = "Apify-based scraper agent for Tiktok For You page"
requires-python = ">=3.10"
dependencies = [
    "apify-client>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]